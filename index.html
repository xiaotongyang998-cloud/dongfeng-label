<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仓库托盘标签系统</title><style>*{box-sizing:border-box}body{font:16px Arial,'Microsoft YaHei',sans-serif;background:#f3f5f8;color:#172334;margin:0}main{max-width:1100px;margin:30px auto;padding:20px}section{background:white;padding:22px;border-radius:12px;margin:16px 0}label{display:block;margin:8px 0}select,input,textarea,button{font:inherit;padding:10px;border:1px solid #b9c3cf;border-radius:6px}textarea{width:100%;height:220px}button{background:#174b78;color:white;cursor:pointer;margin:5px} .fields{display:flex;gap:20px;flex-wrap:wrap}#out{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.item{border:1px solid #ddd;padding:10px;border-radius:8px}canvas{width:100%;height:auto;border:1px solid #ddd}small{color:#536477} .item input{width:100%}.qty{display:flex;gap:10px}.qty label{flex:1;min-width:0}#count{font-weight:bold;color:#174b78}</style><main><h1>仓库到货 · 托盘标签系统 V2.0</h1><section><div class="fields"><label>到仓方式<br><select id="way"><option>送货到仓</option><option>快递到仓</option></select></label><label>货物状态<br><select id="status"><option>HOLD</option><option>自提 HOLD</option></select></label><label>到仓日期<br><input type="date" id="date" value="2026-11-25"></label></div><label>复制货物清单（每行一个唛头，可附带件数、板数）</label><textarea id="raw">HC26110600083   6件    1托
HC26110600077   21件    1托
HC26110600079   6件    1托
HC26110600080   12件    1托
HC26110600076   19件    1托
HC26110600074   13件    1托
HC26110600072   13件    1托
HC26110600078   18件    1托
HC26110600081   5件
HC26110600082   2件==1托</textarea><label><input type="checkbox" id="merge" checked> 将末尾 HC26110600081 和 HC26110600082 合并为一张共托标签（仅当两者均存在）</label><button onclick="generate()">生成标签</button><button onclick="pdfAll()" id="pdf">下载连续 PDF</button><span id="count"></span><p><small>每张 PNG 为 1800 × 1200 像素。可在预览中修改唛头；托盘数自动识别，打印张数默认等于托盘数 × 2，可手动调整。PDF 每页 6 × 4 英寸横版。标签仅显示四行，不显示件数或板数。</small></p></section><section id="out"></section></main><script>
const $=id=>document.getElementById(id);let items=[];function draw(c,mark){let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,1800,1200);x.fillStyle='black';x.textAlign='center';x.textBaseline='middle';let lines=[$('way').value,mark,$('status').value,$('date').value.replaceAll('-','/')];lines.forEach((s,i)=>{let size=[220,190,210,190][i];x.font=`bold ${size}px Arial, Microsoft YaHei, PingFang SC, sans-serif`;while(x.measureText(s).width>1660&&size>30){size-=4;x.font=`bold ${size}px Arial, Microsoft YaHei, PingFang SC, sans-serif`;}x.fillText(s,900,[185,485,775,1040][i]);});}function parse(raw,merge){let rows=raw.split(/\n/).map(s=>s.trim()).filter(Boolean).map(s=>{let m=s.match(/^[^\s,，;；]+/)[0];let n=s.match(/(\d+)\s*(?:托|板|PLT\b|pallets?\b)/i);return {mark:m,pallets:n?Number(n[1]):1}});let a='HC26110600081',b='HC26110600082';if(merge&&rows.some(r=>r.mark===a)&&rows.some(r=>r.mark===b)){rows=rows.filter(r=>r.mark!==b).map(r=>r.mark===a?{mark:a+' / '+b,pallets:1}:r)}return rows}function total(){let p=items.reduce((a,it)=>a+Number(it.p.value||0),0),n=items.reduce((a,it)=>a+Number(it.n.value||0),0);$('count').textContent=`共 ${items.length} 组 / ${p} 托 / ${n} 页`;}function generate(){if(!$('date').value){alert('请选择日期');return}let rows=parse($('raw').value,$('merge').checked);$('out').replaceChildren();items=[];rows.forEach((r,i)=>{let d=document.createElement('div');d.className='item';let c=document.createElement('canvas');c.width=1800;c.height=1200;let inp=document.createElement('input');inp.value=r.mark;let q=document.createElement('div');q.className='qty';function field(name,value){let l=document.createElement('label');l.textContent=name;let e=document.createElement('input');e.type='number';e.min=0;e.max=1000;e.step=1;e.value=value;l.append(e);q.append(l);return e}let p=field('托盘数',r.pallets),n=field('打印张数',r.pallets*2);let btn=document.createElement('button');btn.textContent='下载 PNG';let item={c,inp,p,n};items.push(item);inp.oninput=()=>draw(c,inp.value);p.oninput=()=>{n.value=Number(p.value||0)*2;total()};n.oninput=total;btn.onclick=()=>c.toBlob(blob=>save(blob,filename(item,i)));d.append(c,inp,q,btn);$('out').append(d);draw(c,r.mark)});total();}function filename(it,i){return String(i+1).padStart(2,'0')+'_'+it.inp.value.replace(/[^\w\u4e00-\u9fff-]/g,'_')+'.png'}function save(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
// Offline PDF writer: JPEG image XObjects reused across duplicate pages.
function makePDF(images){const enc=new TextEncoder(),parts=[],offsets=[0];let pos=0;function add(v){let b=typeof v==='string'?enc.encode(v):v;parts.push(b);pos+=b.length}function obj(id,body,bytes){offsets[id]=pos;add(id+' 0 obj\n'+body);if(bytes){add('\nstream\n');add(bytes);add('\nendstream')}add('\nendobj\n')}let next=3,pages=[];for(let im of images){im.id=next++;for(let j=0;j<im.count;j++)pages.push({id:next++,im})}add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map(p=>p.id+' 0 R').join(' ')+'] >>');for(let im of images)obj(im.id,`<< /Type /XObject /Subtype /Image /Width 1800 /Height 1200 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>`,im.data);let content=enc.encode('q 432 0 0 288 0 0 cm /Im0 Do Q');let cid=next++;obj(cid,`<< /Length ${content.length} >>`,content);for(let p of pages)obj(p.id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 432 288] /Resources << /XObject << /Im0 ${p.im.id} 0 R >> >> /Contents ${cid} 0 R >>`);let xref=pos;add('xref\n0 '+next+'\n0000000000 65535 f \n');for(let i=1;i<next;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size '+next+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');return new Blob(parts,{type:'application/pdf'})}async function pdfAll(){if(!$('date').value){alert('请选择日期');return}if(items.some(it=>!it.n.checkValidity()||!it.p.checkValidity()||it.n.value===''||it.p.value==='')){alert('请输入有效的非负整数');return}let count=items.reduce((a,it)=>a+Number(it.n.value),0);if(!count||count>2000){alert('请选择 1–2000 张标签');return}let images=[];$('pdf').disabled=true;try{for(let it of items){let n=Number(it.n.value);if(!n)continue;draw(it.c,it.inp.value);let b=await new Promise(r=>it.c.toBlob(r,'image/jpeg',0.98));images.push({count:n,data:new Uint8Array(await b.arrayBuffer())})}save(makePDF(images),'warehouse_labels_'+$('date').value+'_'+count+'pages.pdf')}catch(e){alert('PDF 生成失败：'+e.message)}finally{$('pdf').disabled=false}}$('merge').onchange=generate;for(let id of ['way','status','date'])$(id).onchange=()=>items.forEach(it=>draw(it.c,it.inp.value));generate();</script></html>
