<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DONGFENG Label V3.0</title><style>*{box-sizing:border-box}body{font:16px Arial,'Microsoft YaHei',sans-serif;background:#f3f5f8;color:#172334;margin:0}main{max-width:1100px;margin:30px auto;padding:20px}section{background:white;padding:22px;border-radius:12px;margin:16px 0}label{display:block;margin:8px 0}select,input,textarea,button{font:inherit;padding:10px;border:1px solid #b9c3cf;border-radius:6px}textarea{width:100%;height:220px}button{background:#174b78;color:white;cursor:pointer;margin:5px} .fields{display:flex;gap:20px;flex-wrap:wrap}#out{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.item{border:1px solid #ddd;padding:10px;border-radius:8px}canvas{width:100%;height:auto;border:1px solid #ddd}small{color:#536477} .item input{width:100%}.qty{display:flex;gap:10px}.qty label{flex:1;min-width:0}#count{font-weight:bold;color:#174b78} .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.settings input,.settings select{max-width:100%} .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px} .item input[type=checkbox]{width:auto} .item textarea{height:70px} .muted{color:#536477;font-size:14px} .secondary{background:white;color:#174b78} .danger{background:white;color:#a32b2b} .item.selected{border:2px solid #174b78} button:disabled{opacity:.5;cursor:default} .item canvas{display:block} h2{font-size:19px} .item label{font-size:14px} </style><main><h1>DONGFENG · 托盘标签 V3.0</h1><section><h2>01 标签模板</h2><div class="settings"><div><label>第一行 · 到仓方式</label><select id="way"></select><div><input id="wayNew" placeholder="新增或修改选项"><button onclick="optionChange('way','add')">添加并保存</button><button class="secondary" onclick="optionChange('way','edit')">修改选中项</button><button class="danger" onclick="optionChange('way','delete')">删除</button></div></div><div><label>第三行 · 货物状态</label><select id="status"></select><div><input id="statusNew" placeholder="新增或修改选项"><button onclick="optionChange('status','add')">添加并保存</button><button class="secondary" onclick="optionChange('status','edit')">修改选中项</button><button class="danger" onclick="optionChange('status','delete')">删除</button></div></div><div><label>第四行 · 到仓日期</label><input type="date" id="date"></div></div><p class="muted" id="storageNote">选项保存在当前浏览器，刷新后仍可使用；不同电脑不会自动同步。</p></section><section><h2>02 导入唛头</h2><textarea id="raw" placeholder="每行一个唛头，可附带件数、托盘数，例如：
DEMO001 5件 1托
DEMO002 2件 1托"></textarea><button onclick="generate()">生成 / 重新导入</button><span class="muted">重新导入会重置当前标签；未注明托数默认1托。</span></section><section><h2>03 标签编辑与打印</h2><div class="toolbar"><button onclick="mergeSelected()">合并勾选标签</button><button class="secondary" onclick="splitSelected()">拆分勾选标签</button><button class="secondary" onclick="selectAll(true)">全选</button><button class="secondary" onclick="selectAll(false)">取消全选</button><button id="pdf" onclick="pdfAll()">下载连续 PDF</button><span id="count"></span></div><p class="muted">勾选任意两组或更多即可合并；共托默认1托，请核对实际托数。修改托数会重新计算打印张数，之后仍可手动调整。PDF 每页 6 × 4 英寸横版。</p><div id="out"></div></section></main><script>
const $=id=>document.getElementById(id);let items=[],groups=[];const defaults={way:['送货到仓','快递到仓'],status:['HOLD','自提 HOLD']};let opts={};for(const k of Object.keys(defaults)){try{let v=JSON.parse(localStorage.getItem('df-label-v3-'+k));opts[k]=Array.isArray(v)&&v.length&&v.every(s=>typeof s==='string'&&s.trim())?v:defaults[k].slice()}catch(e){opts[k]=defaults[k].slice()}}function fill(k,value){$(k).replaceChildren(...opts[k].map(s=>new Option(s,s)));if(opts[k].includes(value))$(k).value=value}function optionChange(k,mode){let old=$(k).value,v=$(k+'New').value.trim();if(mode==='delete'){if(opts[k].length===1)return alert('至少保留一个选项');if(!confirm('删除选项：'+old+'？'))return;opts[k]=opts[k].filter(s=>s!==old);v=opts[k][0]}else{if(!v)return alert('请输入选项内容');if(mode==='edit')opts[k]=opts[k].map(s=>s===old?v:s);else opts[k].push(v);opts[k]=[...new Set(opts[k])]}try{localStorage.setItem('df-label-v3-'+k,JSON.stringify(opts[k]))}catch(e){$('storageNote').textContent='浏览器禁止本地保存，本次修改仅在当前页面有效。'}fill(k,v);$(k+'New').value='';redraw()}for(let k of Object.keys(defaults))fill(k);let today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
function parse(raw){return raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>{let mark=s.match(/^[^\s,，;；]+/)[0],m=s.match(/(\d+)\s*(?:托|板|PLT\b|pallets?\b)/i);let p=m?Number(m[1]):1;return {mark,p,n:p*2,selected:false,members:null}})}
function draw(c,mark){let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,1800,1200);x.fillStyle='black';x.textAlign='center';x.textBaseline='middle';let lines=[$('way').value,mark,$('status').value,$('date').value.replaceAll('-','/')];lines.forEach((s,i)=>{let size=[220,190,210,190][i];x.font=`bold ${size}px Arial, Microsoft YaHei, PingFang SC, sans-serif`;while(x.measureText(s).width>1660&&size>1){size-=1;x.font=`bold ${size}px Arial, Microsoft YaHei, PingFang SC, sans-serif`}x.fillText(s,900,[185,485,775,1040][i],1660)})}function redraw(){items.forEach(it=>draw(it.c,it.g.mark))}function total(){let p=groups.reduce((a,g)=>a+Number(g.p||0),0),n=groups.reduce((a,g)=>a+Number(g.n||0),0);$('count').textContent=`共 ${groups.length} 组 / ${p} 托 / ${n} 页`}
function generate(){if(groups.length&&!confirm('重新导入将清除当前编辑和合并设置，继续？'))return;groups=parse($('raw').value);render()}function selectAll(v){groups.forEach(g=>g.selected=v);items.forEach(it=>{it.check.checked=v;it.d.classList.toggle('selected',v)})}function mergeSelected(){let chosen=groups.filter(g=>g.selected);if(chosen.length<2)return alert('请至少勾选两组标签');let first=groups.indexOf(chosen[0]);let merged={mark:chosen.map(g=>g.mark).join(' / '),p:1,n:2,selected:false,members:chosen.flatMap(g=>g.members||[{...g,selected:false}])};groups=groups.filter(g=>!g.selected);groups.splice(first,0,merged);render()}function splitSelected(){if(!groups.some(g=>g.selected&&g.members))return alert('请勾选已合并的标签');groups=groups.flatMap(g=>g.selected&&g.members?g.members.map(m=>({...m,selected:false})): [g]);render()}
function render(){$('out').replaceChildren();items=[];groups.forEach((g,i)=>{let d=document.createElement('div');d.className='item';d.classList.toggle('selected',g.selected);let l=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=g.selected;check.onchange=()=>{g.selected=check.checked;d.classList.toggle('selected',g.selected)};l.append(check,document.createTextNode(g.members?' 勾选 · 已合并 '+g.members.length+' 个唛头':' 勾选 · 独立标签'));let c=document.createElement('canvas');c.width=1800;c.height=1200;let inp=document.createElement('input');inp.value=g.mark;inp.setAttribute('aria-label','第二行唛头');inp.oninput=()=>{g.mark=inp.value;draw(c,g.mark)};let q=document.createElement('div');q.className='qty';function field(name,key){let l=document.createElement('label');l.textContent=name;let e=document.createElement('input');e.type='number';e.min=0;e.max=key==='p'?1000:2000;e.step=1;e.value=g[key];l.append(e);q.append(l);return e}let p=field('托盘数','p'),n=field('打印张数','n');p.oninput=()=>{g.p=p.value;g.n=n.value=Number(p.value||0)*2;total()};n.oninput=()=>{g.n=n.value;total()};let btn=document.createElement('button');btn.textContent='下载 PNG';btn.onclick=()=>{if(!$('date').value)return alert('请选择日期');draw(c,g.mark);c.toBlob(b=>save(b,`label_${i+1}_${g.mark.replace(/[^\w\u4e00-\u9fff-]/g,'_')}.png`))};d.append(l,c,inp,q,btn);$('out').append(d);items.push({g,c,p,n,check,d});draw(c,g.mark)});total()}function save(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function makePDF(images){const enc=new TextEncoder(),parts=[],offsets=[0];let pos=0;function add(v){let b=typeof v==='string'?enc.encode(v):v;parts.push(b);pos+=b.length}function obj(id,body,bytes){offsets[id]=pos;add(id+' 0 obj\n'+body);if(bytes){add('\nstream\n');add(bytes);add('\nendstream')}add('\nendobj\n')}let next=3,pages=[];for(let im of images){im.id=next++;for(let j=0;j<im.count;j++)pages.push({id:next++,im})}add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map(p=>p.id+' 0 R').join(' ')+'] >>');for(let im of images)obj(im.id,`<< /Type /XObject /Subtype /Image /Width 1800 /Height 1200 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>`,im.data);let content=enc.encode('q 432 0 0 288 0 0 cm /Im0 Do Q');let cid=next++;obj(cid,`<< /Length ${content.length} >>`,content);for(let p of pages)obj(p.id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 432 288] /Resources << /XObject << /Im0 ${p.im.id} 0 R >> >> /Contents ${cid} 0 R >>`);let xref=pos;add('xref\n0 '+next+'\n0000000000 65535 f \n');for(let i=1;i<next;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size '+next+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');return new Blob(parts,{type:'application/pdf'})}
async function pdfAll(){if(!$('date').value)return alert('请选择日期');if(items.some(it=>!it.p.checkValidity()||!it.n.checkValidity()||it.p.value===''||it.n.value===''||!it.g.mark.trim()))return alert('请检查唛头和数量');let count=groups.reduce((a,g)=>a+Number(g.n),0);if(!count||count>2000)return alert('请选择1–2000张标签');let images=[];$('pdf').disabled=true;try{for(let it of items){let n=Number(it.g.n);if(!n)continue;draw(it.c,it.g.mark);let b=await new Promise(r=>it.c.toBlob(r,'image/jpeg',0.98));images.push({count:n,data:new Uint8Array(await b.arrayBuffer())})}save(makePDF(images),'warehouse_labels_'+$('date').value+'_'+count+'pages.pdf')}catch(e){alert('PDF生成失败：'+e.message)}finally{$('pdf').disabled=false}}for(let id of ['way','status','date'])$(id).onchange=redraw;render();</script></html>
